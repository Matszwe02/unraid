name: Generate Unraid XML Config

on:
  workflow_dispatch
  push:
    branches:
      - main

jobs:
  update-xml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run XML generation script
        run: python generate_config_xml.py

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add templates/ytdlp-web-player.xml
          git diff --quiet --exit-code || (git commit -m "Update ytdlp-web-player.xml" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}